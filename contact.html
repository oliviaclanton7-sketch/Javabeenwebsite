<!DOCTYPE html>
<html lang="en">

<head>

<title>Java Been - Contact</title>

<meta name="viewport" content="width=device-width, initial-scale=1.0">

<link href="https://cdn.jsdelivr.net/npm/bootstrap@5.3.3/dist/css/bootstrap.min.css" rel="stylesheet">

<link rel="stylesheet" href="style.css">

</head>


<body>


<header>

<img src="header guy.png" class="headerGuyLeft" alt="Java Been character">

<img src="header guy.png" class="headerGuyRight" alt="Java Been character">

<h1>JAVA BEEN</h1>

<p>Coffee Community Creativity</p>

</header>


<div class="logoArea">

<img src="logo java.png" alt="Java Been Logo">

</div>


<nav>

<button id="menuButton">☰ Menu</button>

<ul id="navMenu">

<li><a href="index.html">Home</a></li>

<li><a href="drinks.html">Featured Drinks</a></li>

<li><a href="about.html">About</a></li>

<li><a href="contact.html">Contact</a></li>

</ul>

</nav>


<main>

<section>

<div class="content">

<div class="row align-items-center">

<div class="col-md-6">

<h2>Contact Java Been</h2>

<img src="contact us.png" class="pageImage" alt="Contact Java Been">

</div>


<div class="col-md-6">

<p>Email: JavaBeen@email.com</p>

<p>Phone: (123) 456-7891</p>


<form id="contactForm">

<label>Name:</label>

<input type="text" id="name">


<label>Email:</label>

<input type="email" id="email">


<label>Message:</label>

<textarea id="message"></textarea>


<button type="submit">Send Message</button>

</form>


<p id="response"></p>

</div>

</div>

</div>

</section>

</main>


<div class="bottomHeader">

<h2>JAVA BEEN</h2>

<img src="logo java.png" alt="Java Been Logo">

</div>


<script src="https://code.jquery.com/jquery-3.7.1.min.js"></script>

<script>

$(document).ready(function(){

    $("#menuButton").click(function(){

        $("#navMenu").slideToggle();

    });


    $("#contactForm").submit(function(event){

        event.preventDefault();

        var name = $("#name").val();

        var email = $("#email").val();

        var message = $("#message").val();


        if(name == "" || email == "" || message == ""){

            $("#response").text("Please fill out all fields.");

        }

        else{

            $("#response").text("Thank you for contacting Java Been!");

        }

    });

});

</script>


</body>

</html>
