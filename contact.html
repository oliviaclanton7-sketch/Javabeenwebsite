<!DOCTYPE html>

<html lang="en">

<head>
<title>Contact - Java Been</title>

<style>

body{
    font-family:Hinde, regular;
    margin:0;
    text-align:center;
    background:#D8C58B;
    color:#5B2C1E;
}

header{
    background:#D8C58B;
    padding:32px 0;
}

header h1{
    margin:0 0 8px 0;
    color:#5B2C1E;
    font-size:36px;
}

header p{
    margin:0;
}

.logoArea{
    background:#D8C58B;
    padding:16px;
}

.logoArea img{
    width:80px;
}

nav{
    background:white;
    border:2px solid #5B2C1E;
    padding:16px;
}

#navMenu{
    list-style:none;
    padding:0;
    margin:0;
}

#navMenu li{
    display:inline;
    margin:16px;
}

#navMenu a{
    color:#5B2C1E;
    text-decoration:none;
}

.container{
    background:white;
}

section{
    padding:48px 24px;
}

h2{
    color:#5B2C1E;
    font-size:28px;
    margin:0 0 24px 0;
}

form{
    max-width:400px;
    margin:24px auto 0 auto;
}

input,
textarea{
    width:100%;
    padding:8px;
    margin:8px 0;
    box-sizing:border-box;
}

textarea{
    height:80px;
}

button{
    padding:8px 16px;
    color:#5B2C1E;
}

footer{
    background:#D8C58B;
    padding:24px;
}

footer p{
    margin:0;
}

@media screen and (max-width:768px){

    #navMenu li{
        display:block;
        margin:8px;
    }

}

</style>

</head>

<body>

<header>

<h1>JAVA BEEN</h1>

<p>Coffee Community Creativity</p>

</header>

<div class="logoArea">

<img src="logo java.png" alt="Java Been Logo">

</div>

<nav>

<ul id="navMenu">

<li><a href="index.html">Home</a></li>

<li><a href="drinks.html">Featured Drinks</a></li>

<li><a href="about.html">About</a></li>

<li><a href="contact.html">Contact</a></li>

</ul>

</nav>

<div class="container">

<section>

<h2>Contact</h2>

<p>Email: JavaBeen@email.com</p>

<form id="contactForm">

<label>Name:</label>

<input type="text" id="name">

<label>Email:</label>

<input type="email" id="email">

<label>Message:</label>

<textarea id="message"></textarea>

<button type="submit">
Send Message
</button>

<p id="response"></p>

</form>

</section>

</div>

<footer>

<p>Java Been</p>

</footer>

<script src="https://code.jquery.com/jquery-3.7.1.min.js"></script>

<script>

$(document).ready(function(){

    $("#contactForm").submit(function(event){

        event.preventDefault();

        var name = $("#name").val();
        var email = $("#email").val();
        var message = $("#message").val();

        if(name == "" || email == "" || message == ""){

            $("#response").text("Please fill out all fields.");

        }else{

            $("#response").text("Thank you for contacting Java Been!");

        }

    });

});

</script>

</body>

</html>
