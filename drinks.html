<!DOCTYPE html>
<html lang="en">

<head>

<title>Java Been - Featured Drinks</title>

<link href="https://cdn.jsdelivr.net/npm/bootstrap@5.3.3/dist/css/bootstrap.min.css" rel="stylesheet">

<style>

body{
    font-family:Hinde, regular;
    margin:0;
    background:#B8A58A;
    color:#56372C;
}

header{
    background:#F5F0E6;
    padding:12px 0 0 0;
    position:relative;
    min-height:220px;
    text-align:center;
}

header h1{
    margin:0;
    color:#56372C;
    font-size:76px;
    font-weight:bold;
    letter-spacing:2px;
}

header p{
    margin:2px 0 0 0;
    color:#56372C;
    font-size:21px;
}

.headerGuyLeft{
    position:absolute;
    left:20px;
    bottom:0;
    width:175px;
}

.headerGuyRight{
    position:absolute;
    right:20px;
    bottom:0;
    width:175px;
}

.logoArea{
    background:#F5F0E6;
    padding:0 0 8px 0;
}

.logoArea img{
    width:190px;
    max-width:60%;
    display:block;
    margin:auto;
}

nav{
    background:#F5F0E6;
    border:2px solid #56372C;
    padding:14px;
}

#navMenu{
    list-style:none;
    padding:0;
    margin:0;
}

#navMenu li{
    display:inline;
    margin:20px;
}

#navMenu a{
    color:#56372C;
    text-decoration:none;
    font-size:17px;
}

#menuButton{
    background:#F5F0E6;
    color:#56372C;
    border:1px solid #56372C;
    padding:8px 16px;
}

section{
    padding:64px 24px;
    text-align:center;
}

h2{
    color:#56372C;
    font-size:38px;
    margin-bottom:40px;
}

p{
    color:#56372C;
    line-height:1.6;
}

.drinkImage{
    width:200px;
    max-width:100%;
    height:auto;
    display:block;
    margin:0 auto 16px auto;
}

.drink{
    padding:16px;
}

.bottomHeader{
    background:#F5F0E6;
    border-top:2px solid #56372C;
    padding:16px 0 12px 0;
    text-align:center;
}

.bottomHeader h2{
    margin:0 0 3px 0;
    font-size:20px;
}

.bottomHeader img{
    width:85px;
    max-width:50%;
}

@media (max-width:768px){

    header{
        min-height:190px;
    }

    header h1{
        font-size:48px;
    }

    header p{
        font-size:17px;
    }

    .headerGuyLeft,
    .headerGuyRight{
        width:110px;
    }

    .headerGuyLeft{
        left:0;
    }

    .headerGuyRight{
        right:0;
    }

    .logoArea img{
        width:160px;
    }

    #navMenu{
        display:none;
    }

    #navMenu li{
        display:block;
        margin:8px;
    }

    section{
        padding:48px 20px;
    }

    .drinkImage{
        width:100%;
        max-width:200px;
    }

}

@media (max-width:480px){

    header h1{
        font-size:38px;
    }

    header p{
        font-size:15px;
    }

    .headerGuyLeft,
    .headerGuyRight{
        width:85px;
    }

    .logoArea img{
        width:130px;
    }

}

</style>

</head>

<body>

<header>

<img src="header guy.png" class="headerGuyLeft" alt="Java Been character">

<img src="header guy.png" class="headerGuyRight" alt="Java Been character">

<h1>JAVA BEEN</h1>

<p>Coffee Community Creativity</p>

</header>

<div class="logoArea">

<img src="logo java.png" alt="Java Been Logo">

</div>

<nav>

<div class="container-fluid text-center">

<button id="menuButton">☰ Menu</button>

<ul id="navMenu">

<li><a href="index.html">Home</a></li>

<li><a href="drinks.html">Featured Drinks</a></li>

<li><a href="about.html">About</a></li>

<li><a href="contact.html">Contact</a></li>

</ul>

</div>

</nav>

<div class="container">

<section>

<h2>Featured Drinks</h2>

<div class="row justify-content-center">

<div class="col-md-6 drink">

<img src="matcha.png" class="drinkImage" alt="Java Been Signature Matcha">

<p>Java Been Signature Matcha</p>

</div>

<div class="col-md-6 drink">

<img src="latte.png" class="drinkImage" alt="Java Been Classic Latte">

<p>Java Been Classic Latte</p>

</div>

</div>

</section>

</div>

<div class="bottomHeader">

<h2>JAVA BEEN</h2>

<img src="logo java.png" alt="Java Been Logo">

</div>

<script src="https://code.jquery.com/jquery-3.7.1.min.js"></script>

<script>

$(document).ready(function(){

    $("#menuButton").click(function(){

        $("#navMenu").slideToggle();

    });

});

</script>

</body>

</html>
